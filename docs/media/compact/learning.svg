<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img"><title>How the implemented SAC learns</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#46dfce"/></marker></defs><rect width="1120" height="560" rx="18" fill="#0d1726"/><text x="35" y="43" fill="#eef5fa" font-size="27" font-family="Arial, Helvetica, sans-serif" font-weight="700">How the implemented SAC learns</text><text x="35" y="75" fill="#a8bdcf" font-size="17" font-family="Arial, Helvetica, sans-serif" font-weight="400">Stochastic experience → replayed updates → deterministic evaluation</text><rect x="35" y="110" width="325" height="125" rx="12" fill="#17263a" stroke="#31465c"/><text x="53" y="140" fill="#46dfce" font-size="19" font-family="Arial, Helvetica, sans-serif" font-weight="700">01  Collect stochastic actions</text><text x="53" y="169" fill="#a8bdcf" font-size="17" font-family="Arial, Helvetica, sans-serif" font-weight="400">15 observations → Gaussian actor</text><text x="53" y="193" fill="#a8bdcf" font-size="17" font-family="Arial, Helvetica, sans-serif" font-weight="400">tanh(sample) → steering / throttle</text><text x="53" y="217" fill="#a8bdcf" font-size="17" font-family="Arial, Helvetica, sans-serif" font-weight="400">Unity supplies reward and next state</text><rect x="398" y="110" width="325" height="125" rx="12" fill="#17263a" stroke="#31465c"/><text x="416" y="140" fill="#46dfce" font-size="19" font-family="Arial, Helvetica, sans-serif" font-weight="700">02  Align and replay transitions</text><text x="416" y="169" fill="#a8bdcf" font-size="17" font-family="Arial, Helvetica, sans-serif" font-weight="400">Store (s, a, r, s′, terminated)</text><text x="416" y="193" fill="#a8bdcf" font-size="17" font-family="Arial, Helvetica, sans-serif" font-weight="400">Uniform replay → minibatches</text><text x="416" y="217" fill="#a8bdcf" font-size="17" font-family="Arial, Helvetica, sans-serif" font-weight="400">Evaluation never enters replay</text><rect x="761" y="110" width="325" height="125" rx="12" fill="#17263a" stroke="#31465c"/><text x="779" y="140" fill="#46dfce" font-size="19" font-family="Arial, Helvetica, sans-serif" font-weight="700">03  Update twin critics</text><text x="779" y="169" fill="#a8bdcf" font-size="17" font-family="Arial, Helvetica, sans-serif" font-weight="400">Soft target uses min target Q</text><text x="779" y="193" fill="#a8bdcf" font-size="17" font-family="Arial, Helvetica, sans-serif" font-weight="400">True termination stops bootstrap</text><text x="779" y="217" fill="#a8bdcf" font-size="17" font-family="Arial, Helvetica, sans-serif" font-weight="400">Time limits retain final state</text><path d="M360 172H398" fill="none" stroke="#46dfce" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M723 172H761" fill="none" stroke="#46dfce" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="761" y="275" width="325" height="125" rx="12" fill="#17263a" stroke="#31465c"/><text x="779" y="305" fill="#46dfce" font-size="19" font-family="Arial, Helvetica, sans-serif" font-weight="700">04  Improve actor + entropy</text><text x="779" y="334" fill="#a8bdcf" font-size="17" font-family="Arial, Helvetica, sans-serif" font-weight="400">Actor minimizes α log π − min Q</text><text x="779" y="358" fill="#a8bdcf" font-size="17" font-family="Arial, Helvetica, sans-serif" font-weight="400">Gradients flow through tanh actions</text><text x="779" y="382" fill="#a8bdcf" font-size="17" font-family="Arial, Helvetica, sans-serif" font-weight="400">Learn α toward target entropy −2</text><rect x="398" y="275" width="325" height="125" rx="12" fill="#17263a" stroke="#31465c"/><text x="416" y="305" fill="#46dfce" font-size="19" font-family="Arial, Helvetica, sans-serif" font-weight="700">05  Move targets slowly</text><text x="416" y="334" fill="#a8bdcf" font-size="17" font-family="Arial, Helvetica, sans-serif" font-weight="400">Target Q ← 0.995 target + 0.005 Q</text><text x="416" y="358" fill="#a8bdcf" font-size="17" font-family="Arial, Helvetica, sans-serif" font-weight="400">Repeat updates on replayed data</text><text x="416" y="382" fill="#a8bdcf" font-size="17" font-family="Arial, Helvetica, sans-serif" font-weight="400">No separate value network</text><rect x="35" y="275" width="325" height="125" rx="12" fill="#17263a" stroke="#31465c"/><text x="53" y="305" fill="#46dfce" font-size="19" font-family="Arial, Helvetica, sans-serif" font-weight="700">06  Evaluate and select</text><text x="53" y="334" fill="#a8bdcf" font-size="17" font-family="Arial, Helvetica, sans-serif" font-weight="400">Drive with tanh(mean); no noise</text><text x="53" y="358" fill="#a8bdcf" font-size="17" font-family="Arial, Helvetica, sans-serif" font-weight="400">Original full routes, held apart</text><text x="53" y="382" fill="#a8bdcf" font-size="17" font-family="Arial, Helvetica, sans-serif" font-weight="400">Completion → clean rate → time</text><path d="M923 235V275" fill="none" stroke="#46dfce" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M761 337H723" fill="none" stroke="#46dfce" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M398 337H360" fill="none" stroke="#46dfce" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M560 275V253H560V235" fill="none" stroke="#46dfce" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="5 5"/><text x="35" y="449" fill="#eef5fa" font-size="19" font-family="Arial, Helvetica, sans-serif" font-weight="400">Training updates weights. Evaluation measures a frozen policy and does not teach it.</text><text x="35" y="484" fill="#a8bdcf" font-size="17" font-family="Arial, Helvetica, sans-serif" font-weight="400">The actor is feedforward: 15 → 64 tanh → 64 tanh → 2 means; standard deviation is used during training.</text><text x="35" y="521" fill="#a8bdcf" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400">Compact quality selection compares time only across the same all-finished tasks; the untouched test never selects a policy.</text></svg>
