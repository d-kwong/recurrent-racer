<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="670" viewBox="0 0 1120 670" role="img"><title>The driving interface</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#46dfce"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#0d1726"/><text x="35" y="43" fill="#eef5fa" font-size="27" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="start">The driving interface</text><text x="35" y="75" fill="#a8bdcf" font-size="17" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Ray geometry schematic · directions show the full 40 m range; live clips show actual hits</text><path d="M270 385 L65.00 385.00" fill="none" stroke="#46dfce" stroke-width="2" stroke-dasharray="6 4"/><text x="43.0" y="385.0" fill="#a8bdcf" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="middle">-90°</text><path d="M270 385 L92.46 282.50" fill="none" stroke="#46dfce" stroke-width="2" stroke-dasharray="6 4"/><text x="73.41223334093245" y="272.5" fill="#a8bdcf" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="middle">-60°</text><path d="M270 385 L125.04 240.04" fill="none" stroke="#46dfce" stroke-width="2" stroke-dasharray="6 4"/><text x="109.48676067065374" y="225.9009742330268" fill="#a8bdcf" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="middle">-45°</text><path d="M270 385 L167.50 207.46" fill="none" stroke="#46dfce" stroke-width="2" stroke-dasharray="6 4"/><text x="156.5" y="190.1442841485013" fill="#a8bdcf" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="middle">-30°</text><path d="M270 385 L216.94 186.99" fill="none" stroke="#46dfce" stroke-width="2" stroke-dasharray="6 4"/><text x="211.2480767617278" y="167.66668908495961" fill="#a8bdcf" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="middle">-15°</text><path d="M270 385 L270.00 180.00" fill="none" stroke="#46dfce" stroke-width="2" stroke-dasharray="6 4"/><text x="270.0" y="160.0" fill="#a8bdcf" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="middle">0°</text><path d="M270 385 L323.06 186.99" fill="none" stroke="#46dfce" stroke-width="2" stroke-dasharray="6 4"/><text x="328.7519232382722" y="167.66668908495961" fill="#a8bdcf" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="middle">15°</text><path d="M270 385 L372.50 207.46" fill="none" stroke="#46dfce" stroke-width="2" stroke-dasharray="6 4"/><text x="383.5" y="190.1442841485013" fill="#a8bdcf" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="middle">30°</text><path d="M270 385 L414.96 240.04" fill="none" stroke="#46dfce" stroke-width="2" stroke-dasharray="6 4"/><text x="430.5132393293463" y="225.9009742330268" fill="#a8bdcf" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="middle">45°</text><path d="M270 385 L447.54 282.50" fill="none" stroke="#46dfce" stroke-width="2" stroke-dasharray="6 4"/><text x="466.58776665906754" y="272.5" fill="#a8bdcf" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="middle">60°</text><path d="M270 385 L475.00 385.00" fill="none" stroke="#46dfce" stroke-width="2" stroke-dasharray="6 4"/><text x="497.0" y="385.0" fill="#a8bdcf" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="middle">90°</text><rect x="254" y="365" width="32" height="80" rx="10" fill="#0d1726" stroke="#ffbe65" stroke-width="2"/><circle cx="270" cy="385" r="6" fill="#ffbe65"/><text x="270" y="122" fill="#ffbe65" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle">LOCAL +Z / FORWARD</text><text x="270" y="495" fill="#a8bdcf" font-size="17" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="middle">Physics pose, not interpolated render pose</text><text x="270" y="524" fill="#a8bdcf" font-size="17" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="middle">Origin = body pose + local (0, 0.15, 0) m</text><text x="270" y="554" fill="#a8bdcf" font-size="17" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="middle">Layer 8 road edges · triggers included</text><rect x="575" y="115" width="510" height="240" rx="12" fill="#17263a" stroke="#31465c"/><text x="595" y="147" fill="#46dfce" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="start">15 inputs · single unstacked float32 vector</text><text x="595" y="178" fill="#a8bdcf" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">0–10: ray hit distance / 40 m; no hit = 1</text><text x="595" y="203" fill="#a8bdcf" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">11: local forward velocity / 48 m/s</text><text x="595" y="228" fill="#a8bdcf" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">12: local lateral velocity / 20 m/s</text><text x="595" y="253" fill="#a8bdcf" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">13: angular velocity about Y / 4 rad/s</text><text x="595" y="278" fill="#a8bdcf" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">14: applied steering angle / 22°</text><text x="595" y="303" fill="#a8bdcf" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Motion values clipped to [−1, +1]</text><rect x="575" y="385" width="510" height="182" rx="12" fill="#17263a" stroke="#31465c"/><text x="595" y="417" fill="#46dfce" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="start">2 actions · tanh normalized</text><text x="595" y="448" fill="#a8bdcf" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">0: steering; −1 left / +1 right</text><text x="595" y="473" fill="#a8bdcf" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">1: longitudinal; + accelerates / − brakes</text><text x="595" y="498" fill="#a8bdcf" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Throttle = max(0, a[1]); brake = max(0, −a[1])</text><text x="595" y="523" fill="#a8bdcf" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Steering limit = 22° / (1 + 0.025 × |speed|)</text><text x="35" y="610" fill="#46dfce" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">50 Hz physics · 10 Hz decisions · steering command slews at 1.5 normalized units/s</text><text x="35" y="644" fill="#a8bdcf" font-size="17" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">No images, position, waypoints, gate index, track map or recurrent state are supplied to the actor.</text></svg>
