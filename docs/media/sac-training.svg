<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="835" viewBox="0 0 1120 835" role="img"><title>How the implemented SAC learns</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#46dfce"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#0d1726"/><text x="35" y="43" fill="#eef5fa" font-size="27" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="start">How the implemented SAC learns</text><text x="35" y="75" fill="#a8bdcf" font-size="17" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Uniform replay · twin critics · differentiable bounded actor · automatic temperature tuning</text><rect x="35" y="110" width="500" height="130" rx="12" fill="#17263a" stroke="#31465c"/><text x="55" y="142" fill="#46dfce" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="start">01  Collect experience</text><text x="55" y="173" fill="#a8bdcf" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Drive Unity with sampled bounded actions</text><text x="55" y="198" fill="#a8bdcf" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Store aligned reward / next state / task ending</text><text x="55" y="223" fill="#a8bdcf" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Replay capacity: 250,000; warm-up: 2,000</text><rect x="585" y="110" width="500" height="130" rx="12" fill="#17263a" stroke="#31465c"/><text x="605" y="142" fill="#46dfce" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="start">02  Sample replay</text><text x="605" y="173" fill="#a8bdcf" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Minibatch: 256; a′ ~ current actor at s′</text><text x="605" y="198" fill="#a8bdcf" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Every 4 transitions: 4 update cycles</text><text x="605" y="223" fill="#a8bdcf" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Evaluation rollouts never enter replay</text><path d="M535 175 H585" fill="none" stroke="#46dfce" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="585" y="280" width="500" height="150" rx="12" fill="#17263a" stroke="#31465c"/><text x="605" y="312" fill="#46dfce" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="start">03  Update both critics</text><text x="605" y="343" fill="#a8bdcf" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">y = 10r + 0.995(1−d) Vsoft(s′)</text><text x="605" y="368" fill="#a8bdcf" font-size="17" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Vsoft = min Qtarget(s′,a′) − α log π(a′|s′)</text><text x="605" y="393" fill="#a8bdcf" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Minimize MSE(Q1, y) + MSE(Q2, y)</text><text x="605" y="418" fill="#a8bdcf" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Detached target; d = true task termination</text><path d="M835 240 V280" fill="none" stroke="#46dfce" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="280" width="500" height="150" rx="12" fill="#17263a" stroke="#31465c"/><text x="55" y="312" fill="#46dfce" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="start">04  Improve the actor</text><text x="55" y="343" fill="#a8bdcf" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Minimize mean[α log π(a|s) − min Q(s,a)]</text><text x="55" y="368" fill="#a8bdcf" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Reparameterized sample + stable tanh Jacobian</text><text x="55" y="393" fill="#a8bdcf" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Freeze Q weights; keep gradients through action</text><text x="55" y="418" fill="#a8bdcf" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Actor: 64/64 tanh; each critic: 128/128 ReLU</text><path d="M585 355 H535" fill="none" stroke="#46dfce" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="475" width="500" height="135" rx="12" fill="#17263a" stroke="#31465c"/><text x="55" y="507" fill="#46dfce" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="start">05  Learn the entropy coefficient</text><text x="55" y="538" fill="#a8bdcf" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">α = exp(log α), initialized at 0.02</text><text x="55" y="563" fill="#a8bdcf" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Target entropy: −2</text><text x="55" y="588" fill="#a8bdcf" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Lα = −mean[log α × (log π + target entropy)]</text><path d="M285 430 V475" fill="none" stroke="#46dfce" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="585" y="475" width="500" height="135" rx="12" fill="#17263a" stroke="#31465c"/><text x="605" y="507" fill="#46dfce" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="start">06  Move target critics slowly</text><text x="605" y="538" fill="#a8bdcf" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Qtarget ← 0.995 Qtarget + 0.005 Q</text><text x="605" y="563" fill="#a8bdcf" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Adam: 0.0003; gradient norm cap: 10</text><text x="605" y="588" fill="#a8bdcf" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">No separate value network</text><path d="M535 543 H585" fill="none" stroke="#46dfce" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1085 543 H1100 V264 H835" fill="none" stroke="#46dfce" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="5 5"/><rect x="35" y="655" width="1050" height="130" rx="12" fill="#17263a" stroke="#31465c"/><text x="55" y="687" fill="#46dfce" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="start">Boundary handling and evaluation</text><text x="55" y="718" fill="#a8bdcf" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">True task terminations stop bootstrap; 120 s time-limit interruptions use the actual final observation.</text><text x="55" y="743" fill="#a8bdcf" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Every ~10,000 training transitions, evaluate tanh(mean) from the original start between episodes.</text><text x="55" y="768" fill="#a8bdcf" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Selection: finish fraction first → shorter estimated finished-lap time → raw episode return.</text></svg>
