<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" role="img"><title>From physics to policy</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#46dfce"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#0d1726"/><text x="35" y="43" fill="#eef5fa" font-size="27" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="start">From physics to policy</text><text x="35" y="75" fill="#a8bdcf" font-size="17" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">One car · 15 numerical observations · two continuous controls · no camera input</text><text x="60" y="119" fill="#ffbe65" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="start">UNITY / C#</text><text x="415" y="119" fill="#ffbe65" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="start">PYTHON / PYTORCH</text><path d="M365 100 V565" fill="none" stroke="#31465c" stroke-width="2" stroke-dasharray="6 6"/><rect x="40" y="145" width="285" height="140" rx="12" fill="#17263a" stroke="#31465c"/><text x="60" y="177" fill="#46dfce" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="start">Racing environment</text><text x="60" y="208" fill="#a8bdcf" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">50 Hz vehicle physics</text><text x="60" y="233" fill="#a8bdcf" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Road-edge ray queries</text><text x="60" y="258" fill="#a8bdcf" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Progress reward + boundaries</text><rect x="415" y="145" width="290" height="140" rx="12" fill="#17263a" stroke="#31465c"/><text x="435" y="177" fill="#46dfce" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="start">Unity transport</text><text x="435" y="208" fill="#a8bdcf" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">11 ray distances; 4 motion fields</text><text x="435" y="233" fill="#a8bdcf" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Reward and final observation</text><text x="435" y="258" fill="#a8bdcf" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">ML-Agents: 10 Hz decisions</text><rect x="760" y="145" width="320" height="140" rx="12" fill="#17263a" stroke="#31465c"/><text x="780" y="177" fill="#46dfce" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="start">SAC actor</text><text x="780" y="208" fill="#a8bdcf" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">15 → 64 → 64 → mean / std</text><text x="780" y="233" fill="#a8bdcf" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Train: tanh(Gaussian sample)</text><text x="780" y="258" fill="#a8bdcf" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Evaluate: tanh(mean)</text><path d="M325 208 H415" fill="none" stroke="#46dfce" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M705 208 H760" fill="none" stroke="#46dfce" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="760" y="335" width="320" height="110" rx="12" fill="#17263a" stroke="#31465c"/><text x="780" y="367" fill="#46dfce" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="start">Bounded action</text><text x="780" y="398" fill="#a8bdcf" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Steering / signed throttle</text><text x="780" y="423" fill="#a8bdcf" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Each command in [−1, +1]</text><rect x="40" y="335" width="285" height="110" rx="12" fill="#17263a" stroke="#31465c"/><text x="60" y="367" fill="#46dfce" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="start">Vehicle control</text><text x="60" y="398" fill="#a8bdcf" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Filtered steering; bicycle yaw</text><text x="60" y="423" fill="#a8bdcf" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Positive throttle / negative brake</text><path d="M920 285 V335" fill="none" stroke="#46dfce" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M760 386 H325" fill="none" stroke="#46dfce" stroke-width="2.5" marker-end="url(#arrow)"/><text x="420" y="370" fill="#a8bdcf" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Actions held for 5 physics ticks</text><path d="M180 335 V285" fill="none" stroke="#46dfce" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="415" y="485" width="290" height="95" rx="12" fill="#17263a" stroke="#31465c"/><text x="435" y="517" fill="#46dfce" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="start">Uniform replay</text><text x="435" y="548" fill="#a8bdcf" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">(s, a, r, s′, task_terminated)</text><rect x="760" y="485" width="320" height="95" rx="12" fill="#17263a" stroke="#31465c"/><text x="780" y="517" fill="#46dfce" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="start">SAC updates</text><text x="780" y="548" fill="#a8bdcf" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Twin Q, actor, learned α, targets</text><path d="M560 285 V335 H380 V532 H415" fill="none" stroke="#46dfce" stroke-width="2.5" marker-end="url(#arrow)"/><text x="383" y="471" fill="#a8bdcf" font-size="15" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Training transitions only</text><path d="M705 532 H760" fill="none" stroke="#46dfce" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1087 532 H1101 V205 H1080" fill="none" stroke="#46dfce" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="5 5"/></svg>
