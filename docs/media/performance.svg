  </g>
  <g id="text_25">
   <text style="fill: #edf3f5; font: 700 19px 'DejaVu Sans'; text-anchor: start" x="51.48" y="24.805031" transform="rotate(-0 51.48 24.805031)">Learning on one fixed track</text>
