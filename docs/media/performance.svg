  <g id="text_26">
   <text style="fill: #a7b6be; font: 10px 'DejaVu Sans'; text-anchor: start" x="51.48" y="38.016" transform="rotate(-0 51.48 38.016)">Deterministic policy · Unity seed 7 · 3 repeated original starts per checkpoint</text>
